# 课题组B的 Nginx 配置
# /etc/nginx/sites-available/structpilot-labB

server {
    listen 80;
    server_name structpilot-labB.local;

    # IP 白名单：只允许本组访问
    allow 192.168.2.0/24;  # 课题组B的IP段（需根据实际情况修改）
    deny all;

    # 密码保护（Nginx Basic Auth，双重保护）
    auth_basic "Lab B Private Area";
    auth_basic_user_file /etc/nginx/.htpasswd_labB;

    location / {
        proxy_pass http://127.0.0.1:8502;  # 注意端口不同
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# 创建密码文件命令：
# sudo htpasswd -c /etc/nginx/.htpasswd_labB admin_labB
# 输入密码：LabB_Secure_2024@
