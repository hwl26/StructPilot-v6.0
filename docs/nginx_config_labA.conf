# 课题组A的 Nginx 配置
# /etc/nginx/sites-available/structpilot-labA

server {
    listen 80;
    server_name structpilot-labA.local;

    # IP 白名单：只允许本组访问
    allow 192.168.1.0/24;  # 课题组A的IP段（需根据实际情况修改）
    deny all;

    # 密码保护（Nginx Basic Auth，双重保护）
    auth_basic "Lab A Private Area";
    auth_basic_user_file /etc/nginx/.htpasswd_labA;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# 创建密码文件命令：
# sudo apt install apache2-utils
# sudo htpasswd -c /etc/nginx/.htpasswd_labA admin_labA
# 输入密码：LabA_Secure_2024@
