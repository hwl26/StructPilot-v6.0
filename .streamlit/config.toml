[theme]
primaryColor = "#3b82f6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#1e293b"
font = "sans serif"

[server]
headless = true
port = 8501
address = "0.0.0.0"  # 绑定到所有网络接口，允许局域网访问
enableXsrfProtection = true
enableCORS = false  # 局域网环境可关闭 CORS 检查
maxUploadSize = 200  # 最大上传文件 200MB（支持大截图）

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
